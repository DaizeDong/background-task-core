[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "background-task-core"
version = "0.1.0"
description = "Local work and automation console with guarded Windows task controls"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fleet-guards>=0.2.1", "llmcall>=0.3.0", "pywin32>=306; sys_platform == 'win32'"]
license = "MIT"

[project.scripts]
background-task-core = "background_task_core.__main__:main"
background-task-core-status = "background_task_core.runs:status_main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["scripts"]
include = ["background_task_core", "background_task_core.*"]
namespaces = true

[tool.setuptools.package-data]
background_task_core = ["*.ps1", "*.html", "*.sql", "*.svg", "*.json", "vendor/tabler/*", "static/*.js", "static/*.css", "static/panels/*.js"]
