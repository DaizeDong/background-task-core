<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="task console">
  <!-- 灯板:这个控制台最有辨识度的那块。九格里一格是红的,因为一块永远全绿的板子
       正是它存在要反对的东西。 -->
  <rect width="64" height="64" rx="13" fill="#0E1A1D"/>
  <g>
    <rect x="12" y="12" width="11" height="11" rx="2.5" fill="#2C7A55"/>
    <rect x="26.5" y="12" width="11" height="11" rx="2.5" fill="#2C7A55"/>
    <rect x="41" y="12" width="11" height="11" rx="2.5" fill="#0E6A75"/>
    <rect x="12" y="26.5" width="11" height="11" rx="2.5" fill="#0E6A75"/>
    <rect x="26.5" y="26.5" width="11" height="11" rx="2.5" fill="#AB3123"/>
    <rect x="41" y="26.5" width="11" height="11" rx="2.5" fill="#2C7A55"/>
    <rect x="12" y="41" width="11" height="11" rx="2.5" fill="#2C7A55"/>
    <rect x="26.5" y="41" width="11" height="11" rx="2.5" fill="#8C6210"/>
    <rect x="41" y="41" width="11" height="11" rx="2.5" fill="#2C7A55"/>
  </g>
</svg>
