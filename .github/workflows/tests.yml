name: tests

# WINDOWS, not ubuntu, and that is the whole point of this file.
#
# The suite this repo carries was inherited from a repository whose test workflow runs on
# ubuntu-latest, where it had been failing continuously since at least 2026-09-09: these tests drive
# Windows Task Scheduler and PowerShell, so on Linux they do not fail for an interesting reason,
# they fail for the only reason available. A red build nobody can act on is worse than no build,
# because it trains everyone to stop reading the badge, and then the day a real failure lands it
# looks exactly like the noise.
#
# The console only means anything on Windows -- server.py refuses to start on any other platform on
# purpose -- so the honest runner is the one the tool actually targets.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  suite:
    runs-on: windows-latest
    env:
      # The package lives under scripts/ (pyproject: packages.find where = scripts). Tests import
      # it as `task_console`, from this checkout, not from an installed copy.
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive        # an empty guards/ is an UNGUARDED repo, not a clean one
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # pywin32 is a real dependency, not a convenience. evtlog.py reads the Task Scheduler
      # Operational channel through it, and without it those tests do not skip, they assert on the
      # wrong sentence: the module reports "pywin32 unavailable" where the test expects the reason
      # the test is actually about. A runner missing it produces failures that say nothing about the
      # code, which is the same wasted red as running this suite on Linux.
      #
      # The libraries the console imports are installed for real, pinned to commits, never stubbed,
      # so CI exercises the import path production uses:
      #   convo-chain   0.3.0, public (server.py, convos.py, work_context.py).
      #   fleet-guards  0.2.1, public; the importable fleet_guards package and canonical
      #                 companion runtime admission used by source and installed packages.
      #   llmcall       0.3.1, PRIVATE; process containment for controller, runtime_windows,
      #                 observations and git_ops. Read with a per-consumer read-only deploy key on
      #                 DaizeDong/llmcall, the same arrangement email-monitor and schedule-reminder use.
      #   skill-smith   0.2.0, public; the skill catalog the observation adapter reads. Imported
      #                 lazily there, so it is a test dependency rather than a pyproject one.
      # A pin is a commit, not a branch, so a change over there cannot turn this build red or green
      # on its own. Move a pin deliberately, together with the pyproject requirement it satisfies.
      # A missing key fails the job instead of skipping those tests: a suite that silently skipped
      # the private dependency would certify a configuration that exists nowhere.
      - name: Install dependencies
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LLMCALL_DEPLOY_KEY: ${{ secrets.LLMCALL_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          test -n "$LLMCALL_DEPLOY_KEY" || { echo "::error::LLMCALL_DEPLOY_KEY is required to read the private dependency"; exit 1; }
          tmp="$(cygpath -u "$RUNNER_TEMP")"
          key="$tmp/llmcall_deploy_key"; hosts="$tmp/github_known_hosts"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$LLMCALL_DEPLOY_KEY" | tr -d '\r' > "$key"
          chmod 600 "$key"
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$hosts"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$hosts"
          python -m pip install --quiet pytest pywin32 PyYAML "setuptools>=77" wheel \
            "fleet-guards @ git+https://github.com/DaizeDong/fleet-guards@0f454415f015f2adab247e3b4829c4c8c0de40da" \
            "llmcall @ git+ssh://git@github.com/DaizeDong/llmcall.git@a7b8d8f412cec73787fbe7f1ff2b742085a0c0c5" \
            "convo-chain @ git+https://github.com/DaizeDong/convo-chain@36be94d60207180b7798fc5ea28de0c991e5fb76" \
            "skill-smith @ git+https://github.com/DaizeDong/skill-smith@7ec8280a5a9108fb6a7dde2fecffc10e8fd26e63"
          # The console itself, installed from a clean export of this commit. Several tests start the
          # observation worker with `python -I`, which ignores PYTHONPATH on purpose, exactly as the
          # installed generation runs it, so they need the package importable the way production has
          # it. Building from an export keeps build/ and *.egg-info out of the checkout under test.
          mkdir -p "$tmp/console-src"
          git archive HEAD | tar -x -C "$tmp/console-src"
          python -m pip install --quiet --no-deps "$tmp/console-src"
          python -I -c "import fleet_guards.filesystem, llmcall.process, convo_chain, skill_smith.catalog, task_console.observations, yaml, win32api; print('dependencies import')" \
            || { echo "::error::a pinned dependency did not import; the suite would fail at collection, which reads as a code defect rather than a missing dependency"; exit 1; }

      # The Task Scheduler Operational channel is OFF by default on Windows, runners included.
      #
      # Two tests read it for real, and they are the POSITIVE CONTROL for the mocked ones around
      # them: without a real read that succeeds, "enabled is False" could be hardcoded and the
      # negative tests would still pass. Skipping them on CI would leave the mocks guarding
      # themselves, so the environment they assert about has to be provided rather than the
      # assertion weakened. Reading zero events is fine; the control is about `enabled` and
      # `partial`, not about volume.
      - name: Enable the channel those tests read
        run: |
          wevtutil sl Microsoft-Windows-TaskScheduler/Operational /e:true
          wevtutil gl Microsoft-Windows-TaskScheduler/Operational | Select-String 'enabled'

      # -B disables bytecode caching. A stale .pyc can outlive the source it came from when mtime
      # seconds and size both happen to be unchanged, and a suite that certifies bytecode from a
      # reverted mutant is a suite that certifies nothing.
      - name: Acceptance suite
        run: |
          if (-not (Test-Path tests)) { Write-Error "the test suite is MISSING -- an absent suite is not a passing suite"; exit 1 }
          python -B -m pytest tests/ -q -p no:cacheprovider -m "not owner_integration"
          # Say once, by name, what did not run and why. Those tests bind the owner's private sources
          # (TASK_CONSOLE_TEST_CONFIG_SOURCE and friends), which by design never exist on a runner; the
          # marker comes from the fixtures they request (tests/conftest.py), and their count is the
          # "deselected" number in the summary above. Run them on the owner machine with the sources set.
          Write-Host "::notice::owner_integration tests were NOT run: they need private owner sources that never exist on a hosted runner"

      # Guards against the suite quietly shrinking to nothing, which would otherwise look exactly
      # like a suite that passes. Raise this deliberately when tests are added; never lower it to
      # make a red build green.
      #
      # 447, the count the runner actually collected on the first green run (2026-09-11). The
      # placeholder this replaces was set below the local number on purpose, because a floor
      # invented from a different machine is a guess wearing a threshold's clothes; now it is an
      # observation. Raise it when tests are added, never lower it to make a red build green.
      #
      # Still 447, deliberately, even though the local suite is now larger: the floor is the last
      # count THIS RUNNER observed, not the count some other machine reports. Raising it to a
      # locally measured number would make the gate assert something nobody has seen it produce,
      # and the first divergence would read as "tests were removed" when it is really "the floor
      # was a guess". Raise it from a green run's own output.
      - name: The suite must not have evaporated
        run: |
          $n = (python -B -m pytest tests/ -q -p no:cacheprovider -m "not owner_integration" --collect-only 2>$null | Select-String '::' | Measure-Object).Count
          Write-Host "collected $n tests"
          if ($n -lt 447) { Write-Error "only $n tests collected, expected at least 447 -- tests were removed or collection broke"; exit 1 }
